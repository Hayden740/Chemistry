<!doctype html>
<html lang="en-AU">
<head>

  <title>Page not found | Year 9 Chemistry</title>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif; color: #013148; background: #EEF8FD; padding: 1.5rem; }
    main { max-width: 34rem; border-left: 10px solid #F46E63; background: #fff; border-radius: 0 18px 18px 0; padding: 1.6rem 1.8rem; }

<body>
  <main>
    <h1>This page has gone missing</h1>
    <p>Unlike mass in a chemical reaction, this page really does seem to have disappeared. Check the address, or head back to the lesson.</p>
    <a id="home" href="./">Back to the lesson</a>
  </main>
  <script>
    // On GitHub Pages project sites the lesson lives one folder down, e.g. /balancing-equations/
    var seg = location.pathname.split('/').filter(Boolean)[0];
    if (location.hostname.endsWith('github.io') && seg) document.getElementById('home').href = '/' + seg + '/';
  </script>
